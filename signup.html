<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Create your account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-shell">
        <div class="auth-layout">
            <aside class="meme-panel meme-left" aria-label="Meme">
                <img src="https://media.tenor.com/lFtDRlWN0HEAAAAM/gerry-fakhri-meme.gif" alt="Funny reaction meme">
            </aside>

            <section class="auth-card" aria-labelledby="signup-title">
            <div class="brand-mark">RR</div>
            <p class="eyebrow">Join us</p>
            <h1 id="signup-title">Create your account</h1>
            <p class="subtitle">It only takes a moment to get started.</p>

            <form action="login.html" method="get">
                <div class="row g-3 mb-1">
                    <div class="col-sm-6">
                        <label for="first-name" class="form-label">First name</label>
                        <input type="text" class="form-control" id="first-name" name="firstName" autocomplete="given-name" required>
                    </div>
                    <div class="col-sm-6">
                        <label for="last-name" class="form-label">Last name</label>
                        <input type="text" class="form-control" id="last-name" name="lastName" autocomplete="family-name" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password" minlength="6" pattern="(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{6,}" title="Use at least 6 characters, including a letter, number, and symbol." autocomplete="new-password" required>
                    </div>
                    <div class="form-text">Use at least 6 characters, including a letter, a number, and a symbol.</div>
                </div>

                <div class="mb-4">
                    <label for="confirm-password" class="form-label">Retype password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirm-password" name="confirmPassword" autocomplete="new-password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 submit-button">Create Account</button>
            </form>

            <p class="account-prompt">Already have an account? <a href="login.html">Log in</a></p>
            </section>

            <aside class="meme-panel meme-right" aria-label="Meme">
                <img src="https://media.tenor.com/iY6Ci8VbCU0AAAAM/totoy-abnoy-evil-laugh.gif" alt="Funny evil laugh meme">
            </aside>
        </div>
    </main>

</body>
</html>
